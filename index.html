<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حساب‌یار</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f3f4f6;
    color:#222;
}
header{
    background:#166534;
    color:white;
    padding:18px;
    text-align:center;
}
header h1{margin:0;font-size:25px}
.container{
    max-width:1100px;
    margin:auto;
    padding:15px;
}
.cards{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:12px;
}
.card{
    background:white;
    padding:20px;
    border-radius:14px;
    box-shadow:0 2px 8px #0001;
    text-align:center;
}
.card strong{
    display:block;
    font-size:25px;
    color:#166534;
    margin-top:8px;
}
.menu{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:10px;
    margin:20px 0;
}
button{
    border:0;
    border-radius:10px;
    padding:13px;
    cursor:pointer;
    background:#166534;
    color:white;
    font-size:15px;
}
button:hover{opacity:.9}
.section{
    background:white;
    padding:18px;
    border-radius:14px;
    margin-top:15px;
    box-shadow:0 2px 8px #0001;
}
input,select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:15px;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
}
th,td{
    border-bottom:1px solid #eee;
    padding:10px;
    text-align:right;
}
th{background:#f5f5f5}
.hidden{display:none}
.danger{background:#b91c1c}
</style>
</head>

<body>

<header>
<h1>حساب‌یار</h1>
<p>سیستم مدیریت و حسابداری</p>
</header>

<div class="container">

<div class="cards">
<div class="card">
فروش
<strong id="salesTotal">0</strong>
</div>

<div class="card">
خرید
<strong id="purchaseTotal">0</strong>
</div>

<div class="card">
تعداد اجناس
<strong id="productTotal">0</strong>
</div>

<div class="card">
مشتریان
<strong id="customerTotal">0</strong>
</div>
</div>

<div class="menu">
<button onclick="showSection('products')">📦 اجناس</button>
<button onclick="showSection('customers')">👤 مشتریان</button>
<button onclick="showSection('sales')">💰 فروش</button>
<button onclick="showSection('purchases')">🛒 خرید</button>
<button onclick="showSection('accounts')">📒 حساب‌ها</button>
</div>

<div id="products" class="section">
<h2>📦 ثبت جنس</h2>

<input id="productName" placeholder="نام جنس">
<input id="productQty" type="number" placeholder="تعداد">
<input id="productPrice" type="number" placeholder="قیمت">

<button onclick="addProduct()">ثبت جنس</button>

<table>
<thead>
<tr>
<th>جنس</th>
<th>تعداد</th>
<th>قیمت</th>
<th>عملیات</th>
</tr>
</thead>
<tbody id="productTable"></tbody>
</table>
</div>

<div id="customers" class="section hidden">
<h2>👤 ثبت مشتری</h2>

<input id="customerName" placeholder="نام مشتری">
<input id="customerPhone" placeholder="شماره تماس">

<button onclick="addCustomer()">ثبت مشتری</button>

<table>
<thead>
<tr>
<th>نام</th>
<th>شماره</th>
<th>عملیات</th>
</tr>
</thead>
<tbody id="customerTable"></tbody>
</table>
</div>

<div id="sales" class="section hidden">
<h2>💰 ثبت فروش</h2>

<input id="saleProduct" placeholder="نام جنس">
<input id="saleQty" type="number" placeholder="تعداد">
<input id="salePrice" type="number" placeholder="قیمت واحد">

<button onclick="addSale()">ثبت فروش</button>

<table>
<thead>
<tr>
<th>جنس</th>
<th>تعداد</th>
<th>قیمت</th>
<th>مجموع</th>
</tr>
</thead>
<tbody id="salesTable"></tbody>
</table>
</div>

<div id="purchases" class="section hidden">
<h2>🛒 ثبت خرید</h2>

<input id="purchaseProduct" placeholder="نام جنس">
<input id="purchaseQty" type="number" placeholder="تعداد">
<input id="purchasePrice" type="number" placeholder="قیمت واحد">

<button onclick="addPurchase()">ثبت خرید</button>

<table>
<thead>
<tr>
<th>جنس</th>
<th>تعداد</th>
<th>قیمت</th>
<th>مجموع</th>
</tr>
</thead>
<tbody id="purchaseTable"></tbody>
</table>
</div>

<div id="accounts" class="section hidden">
<h2>📒 حساب‌ها</h2>
<p>مجموع فروش: <b id="accountSales">0</b></p>
<p>مجموع خرید: <b id="accountPurchases">0</b></p>
<p>سود تقریبی: <b id="profit">0</b></p>
</div>

</div>

<script>

let products =
JSON.parse(localStorage.getItem("products") || "[]");

let customers =
JSON.parse(localStorage.getItem("customers") || "[]");

let sales =
JSON.parse(localStorage.getItem("sales") || "[]");

let purchases =
JSON.parse(localStorage.getItem("purchases") || "[]");

function save(){
localStorage.setItem("products",JSON.stringify(products));
localStorage.setItem("customers",JSON.stringify(customers));
localStorage.setItem("sales",JSON.stringify(sales));
localStorage.setItem("purchases",JSON.stringify(purchases));
}

function showSection(id){
document.querySelectorAll(".section")
.forEach(x=>x.classList.add("hidden"));

document.getElementById(id).classList.remove("hidden");
}

function addProduct(){

let name=document.getElementById("productName").value;
let qty=Number(document.getElementById("productQty").value);
let price=Number(document.getElementById("productPrice").value);

if(!name || !qty || !price){
alert("لطفاً همه معلومات را وارد کنید");
return;
}

products.push({name,qty,price});

save();
render();

document.getElementById("productName").value="";
document.getElementById("productQty").value="";
document.getElementById("productPrice").value="";
}

function deleteProduct(i){
products.splice(i,1);
save();
render();
}

function addCustomer(){

let name=document.getElementById("customerName").value;
let phone=document.getElementById("customerPhone").value;

if(!name){
alert("نام مشتری را وارد کنید");
return;
}

customers.push({name,phone});

save();
render();

document.getElementById("customerName").value="";
document.getElementById("customerPhone").value="";
}

function deleteCustomer(i){
customers.splice(i,1);
save();
render();
}

function addSale(){

let product=document.getElementById("saleProduct").value;
let qty=Number(document.getElementById("saleQty").value);
let price=Number(document.getElementById("salePrice").value);

if(!product || !qty || !price){
alert("لطفاً همه معلومات را وارد کنید");
return;
}

sales.push({
product,
qty,
price,
total:qty*price,
date:new Date().toLocaleDateString("fa-AF")
});

save();
render();

document.getElementById("saleProduct").value="";
document.getElementById("saleQty").value="";
document.getElementById("salePrice").value="";
}

function addPurchase(){

let product=document.getElementById("purchaseProduct").value;
let qty=Number(document.getElementById("purchaseQty").value);
let price=Number(document.getElementById("purchasePrice").value);

if(!product || !qty || !price){
alert("لطفاً همه معلومات را وارد کنید");
return;
}

purchases.push({
product,
qty,
price,
total:qty*price,
date:new Date().toLocaleDateString("fa-AF")
});

save();
render();

document.getElementById("purchaseProduct").value="";
document.getElementById("purchaseQty").value="";
document.getElementById("purchasePrice").value="";
}

function render(){

document.getElementById("productTable").innerHTML =
products.map((p,i)=>`
<tr>
<td>${p.name}</td>
<td>${p.qty}</td>
<td>${p.price}</td>
<td><button class="danger" onclick="deleteProduct(${i})">حذف</button></td>
</tr>`).join("");

document.getElementById("customerTable").innerHTML =
customers.map((c,i)=>`
<tr>
<td>${c.name}</td>
<td>${c.phone || "-"}</td>
<td><button class="danger" onclick="deleteCustomer(${i})">حذف</button></td>
</tr>`).join("");

document.getElementById("salesTable").innerHTML =
sales.map(s=>`
<tr>
<td>${s.product}</td>
<td>${s.qty}</td>
<td>${s.price}</td>
<td>${s.total}</td>
</tr>`).join("");

document.getElementById("purchaseTable").innerHTML =
purchases.map(p=>`
<tr>
<td>${p.product}</td>
<td>${p.qty}</td>
<td>${p.price}</td>
<td>${p.total}</td>
</tr>`).join("");

let salesTotal=sales.reduce((a,b)=>a+b.total,0);
let purchaseTotal=purchases.reduce((a,b)=>a+b.total,0);

document.getElementById("salesTotal").textContent=salesTotal;
document.getElementById("purchaseTotal").textContent=purchaseTotal;
document.getElementById("productTotal").textContent=products.length;
document.getElementById("customerTotal").textContent=customers.length;

document.getElementById("accountSales").textContent=salesTotal;
document.getElementById("accountPurchases").textContent=purchaseTotal;
document.getElementById("profit").textContent=salesTotal-purchaseTotal;
}

render();

</script>

</body>
</html>
